# ============================================================================
# CD  (Continuous Delivery)  -  RUNS FOR FREE, NO CLOUD ACCOUNT NEEDED
#
# Same shape as a real production pipeline (see deploy.yml for the Google
# Cloud Run version), but using free GitHub features:
#
#   REGISTRY    -> GitHub Container Registry (ghcr.io) instead of Artifact Registry
#   STAGING     -> the real container is started on the runner and smoke tested
#   APPROVAL    -> a GitHub "Environment" that pauses until you click Approve
#   PRODUCTION  -> the tested image is PROMOTED by giving it the "production" tag
#
# Flow:   build image once  ->  staging (run + smoke test)  ->  approval
#         ->  promote the SAME image to production
#
# Triggers:
#   - push to main      : a merged pull request starts the pipeline
#   - workflow_dispatch : "Run workflow" button, for practice
# ============================================================================
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write            # allowed to push images to ghcr.io for this repo

# Never cancel a deployment half-way; queue the next one instead.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1. BUILD ONCE: create the image and push it, tagged with the Git commit.
  #    The commit tag makes every image traceable and every rollback exact.
  # --------------------------------------------------------------------------
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.name.outputs.image }}      # passed to later jobs
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase, so we normalise the owner name.
      - name: Compute image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/legalmind-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic token, nothing to create

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Links the image to this repository so later jobs may pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 2. STAGING: start the exact image we just built and test it for real.
  # --------------------------------------------------------------------------
  deploy-staging:
    name: Staging - run and smoke test
    needs: build                       # only runs if build succeeded
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging               # shows up under the repo's "Deployments"
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the container (staging config, no real secrets)
        run: |
          docker run -d --name legalmind-staging -p 8080:8080 \
            -e PORT=8080 \
            -e ENVIRONMENT=staging \
            -e AUTH_REQUIRED=true \
            "${{ needs.build.outputs.image }}:${{ github.sha }}"

      # SMOKE TEST 1: is the app alive?  Retry for up to ~60s while it boots.
      - name: Smoke test - /health responds
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then
              echo; echo "Health check passed"; exit 0
            fi
            echo "Waiting for app to start... ($i/30)"; sleep 2
          done
          echo "App did not become healthy"; exit 1

      # SMOKE TEST 2: is security switched on?  With AUTH_REQUIRED=true, a
      # request without a login token must be rejected with HTTP 401.
      - name: Smoke test - protected route rejects anonymous requests
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                   http://localhost:8080/agent/conversations)
          echo "HTTP status without token: $status"
          test "$status" = "401"

      # If anything above failed, show the container logs to debug it.
      - name: Show container logs on failure
        if: failure()
        run: docker logs legalmind-staging

  # --------------------------------------------------------------------------
  # 3. PRODUCTION: promote the SAME image, after a human approves.
  #    The approval comes from the "production" Environment's required
  #    reviewers (set in Settings -> Environments). Until someone approves,
  #    this job waits.
  # --------------------------------------------------------------------------
  deploy-production:
    name: Production - promote image
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # "Deploying" here = pointing the "production" tag at the image that just
      # passed staging. No rebuild: what we tested is exactly what we ship.
      # On a real platform this step would be "deploy this image to Cloud Run".
      - name: Promote image to production
        run: |
          docker buildx imagetools create \
            --tag "${{ needs.build.outputs.image }}:production" \
            "${{ needs.build.outputs.image }}:${{ github.sha }}"

      - name: Deployment summary
        run: |
          {
            echo "## Production deployment"
            echo "- Image: \`${{ needs.build.outputs.image }}\`"
            echo "- Version (commit): \`${{ github.sha }}\`"
            echo "- Tag now pointing at it: \`production\`"
            echo "- To roll back, run the **Rollback** workflow with an older commit SHA."
          } >> "$GITHUB_STEP_SUMMARY"
